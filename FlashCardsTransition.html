<!DOCTYPE html>
<html>
    <head>
        <title>Flashcards</title>
        <style>
            /* styles.css */
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background: white;
                font-family: Arial;
            }

            .flashcard-container {
                text-align: center;
            }

            .flashcard {
                width: 300px;
                height: 300px;
                margin: 20px auto;
                perspective: 1000px;
                cursor: pointer;
                position: relative;
            }

            .card-inner {
                width: 100%;
                height: 100%;
                position: relative;
                transition: transform 0.5s;
                transform-style: preserve-3d;
            }

            .card-inner.flipped {
            transform: rotateY(180deg);
            }

            .card-front, .card-back {
            position: absolute;
            backface-visibility: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid black;
            border-radius: 8px;
            }

            /* Front face shows by default */
            .card-front {
            background: aqua;
            }

            /* Back face: rotate so that when the card is flipped it is visible */
            .card-back {
            background: aquamarine;
            transform: rotateY(180deg);
            }

            .nav-buttons button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            }

        </style>
    </head>
    <body>
        <div id = 'flashcard-container' class="flashcard-container">
            <h1>English to Spanish Flashcards</h1>

            <div id="flashcard" class="flashcard">
                <div id="cardInner" class="card-inner">
                    <div id="cardFront" class="card-front card-face"> Hello </div>
                    <div id="cardBack" class="card-back card-face"> Hola </div>
                </div>
            </div>

            <div id="navButtons" class="nav-buttons">
                <button name="prev" id="prev">Prev</button>
                <button name="next" id="next">Next</button>
            </div>

        </div>

        <script>

            const cards = [
                {front: "Hello",back: "Hola"}, { front: 'Goodbye', back: 'Adiós' }, { front: 'Thank you', back: 'Gracias' }, { front: 'Please', back: 'Por favor' },
                { front: 'Yes', back: 'Sí' }, { front: 'No', back: 'No' }, { front: 'Excuse me', back: 'Disculpe' }, { front: 'I\'m sorry', back: 'Lo siento' },
                { front: 'Good morning', back: 'Buenos días' }, { front: 'Good night', back: 'Buenas noches' }, { front: 'How are you?', back: '¿Cómo estás?' },
                { front: 'I\'m fine', back: 'Estoy bien' }, { front: 'What\'s your name?',  back: '¿Cómo te llamas?' }, { front: 'My name is...', back: 'Me llamo...' },
                { front: 'Where is...?', back: '¿Dónde está...?' }, { front: 'I don\'t understand', back: 'No entiendo' }, { front: 'Could you help me?',  back: '¿Podrías ayudarme?' },
                { front: 'How much is it?', back: '¿Cuánto cuesta?' }, { front: 'I love you', back: 'Te quiero' }, { front: 'Cheers!', back: '¡Salud!' }
            ];
            const n = cards.length;
            var cardIndex = 0;
            var isFlipped = false;

            const flashcard = document.getElementById('flashcard');
            const cardInner = document.getElementById('cardInner')
            const cardFront = document.getElementById('cardFront');
            const cardBack = document.getElementById('cardBack');
            const next = document.getElementById('next');
            const prev = document.getElementById('prev');

            flashcard.addEventListener('click', () => {
                isFlipped = !isFlipped;
                cardInner.classList.toggle("flipped");
            })

            function updateCard(){
                isFlipped = false;
                cardInner.classList.remove("flipped");
                cardFront.innerHTML = cards[cardIndex].front;
                cardBack.innerHTML = cards[cardIndex].back;
            }

            next.addEventListener('click', (e) => {
                cardIndex = (cardIndex + 1) % n;  
                updateCard();   
            });

            prev.addEventListener('click', (e) => {
                cardIndex -= 1;
                if(cardIndex < 0){
                    cardIndex = n - 1;
                }
                updateCard();
            });

        </script>

    </body>
</html>
